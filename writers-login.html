<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود نویسندگان | پارادوکس</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #090909;
            color: #eee;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: min(430px, 100%);
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 15px;
            padding: 35px;
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
        }

        .sub {
            text-align: center;
            color: #777;
            line-height: 2;
            font-size: 13px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #bbb;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px;
            border-radius: 7px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        .accept {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 15px;
            background: #0c0c0c;
            border: 1px solid #292929;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .accept input {
            margin-top: 4px;
        }

        .accept label {
            margin: 0;
            color: #999;
            line-height: 1.9;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #eee;
            color: #111;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .message {
            min-height: 30px;
            margin-top: 18px;
            color: #888;
            text-align: center;
            line-height: 1.9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>پارادوکس</h1>

    <div class="sub">
        ورود نویسندگان و مالک
    </div>

    <form id="loginForm">

        <label for="username">
            نام کاربری
        </label>

        <input
            id="username"
            type="text"
            autocomplete="username"
            required
        >

        <label for="password">
            رمز عبور
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <div class="accept">

            <input
                id="responsibility"
                type="checkbox"
                required
            >

            <label for="responsibility">
                می‌پذیرم که تمام مسئولیت نوشته‌ها و
                فایل‌هایی که با این حساب منتشر می‌شوند
                بر عهدهٔ خودم است.
            </label>

        </div>

        <button id="loginButton" type="submit">
            ورود
        </button>

    </form>

    <div id="message" class="message"></div>

    <a class="back" href="main.html">
        بازگشت به پارادوکس
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


function escapeHtml(text) {
    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const accepted =
            document
                .getElementById("responsibility")
                .checked;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("loginButton");


        if (!accepted) {

            message.textContent =
                "برای ورود باید پذیرش مسئولیت را تأیید کنید.";

            return;
        }


        button.disabled = true;

        message.textContent =
            "در حال ورود...";


        /*
         * توجه:
         * این بخش فقط برای پیدا کردن ایمیل حساب است.
         */

        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .select("id, username, role")
                .eq("username", username)
                .maybeSingle();


        if (profileError || !profile) {

            button.disabled = false;

            message.textContent =
                "نام کاربری یا رمز عبور نادرست است.";

            return;
        }


        if (
            profile.role !== "writer" &&
            profile.role !== "owner"
        ) {

            button.disabled = false;

            message.textContent =
                "این حساب اجازهٔ ورود به بخش نویسندگان را ندارد.";

            return;
        }


        /*
         * از مرورگر نباید auth.users.email را
         * مستقیماً بخوانیم.
         *
         * بنابراین در مرحلهٔ بعد یک راه امن‌تر
         * برای نگاشت username به email می‌سازیم.
         */

        button.disabled = false;

        message.textContent =
            "حساب پیدا شد؛ مرحلهٔ اتصال امن ورود در گام بعد تکمیل می‌شود.";

    });

</script>

</body>
</html>
