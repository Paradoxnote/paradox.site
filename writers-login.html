<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود نویسندگان | پارادوکس</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #090909;
            color: #eee;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: min(430px, 100%);
            background: #111;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 35px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            line-height: 2;
            margin-bottom: 28px;
            font-size: 13px;
        }

        label {
            display: block;
            color: #bbb;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;

            background: #090909;
            color: #fff;

            border: 1px solid #333;
            border-radius: 7px;

            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        .accept {
            display: flex;
            align-items: flex-start;
            gap: 10px;

            padding: 15px;
            margin-bottom: 20px;

            background: #0c0c0c;
            border: 1px solid #292929;
            border-radius: 8px;
        }

        .accept input {
            margin-top: 4px;
        }

        .accept label {
            margin: 0;
            color: #999;
            line-height: 1.9;
        }

        button {
            width: 100%;
            padding: 13px;

            border: 0;
            border-radius: 7px;

            background: #eee;
            color: #111;

            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #fff;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .message {
            min-height: 35px;
            margin-top: 18px;

            text-align: center;
            color: #999;
            line-height: 1.9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: #777;
            text-decoration: none;
        }

        .back:hover {
            color: #fff;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        پارادوکس
    </div>

    <div class="subtitle">
        ورود ویژهٔ نویسندگان و مالک
    </div>


    <form id="writerLoginForm">

        <label for="email">
            ایمیل
        </label>

        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="ایمیل حساب نویسندگی"
            required
        >


        <label for="password">
            رمز عبور
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="رمز عبور"
            required
        >


        <div class="accept">

            <input
                id="responsibility"
                type="checkbox"
                required
            >

            <label for="responsibility">
                می‌پذیرم که تمام مسئولیت نوشته‌ها،
                تصویرها، ویدئوها و فایل‌هایی که با
                این حساب منتشر می‌شوند بر عهدهٔ خودم است.
            </label>

        </div>


        <button
            id="loginButton"
            type="submit"
        >
            ورود
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="main.html"
        class="back"
    >
        بازگشت به پارادوکس
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://cnmkwfbgovwvyuzluera.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_gbZH8FlhWbWWKDPxCQlBFg_J1xA_PmO";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const form =
    document.getElementById(
        "writerLoginForm"
    );

const message =
    document.getElementById(
        "message"
    );

const button =
    document.getElementById(
        "loginButton"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const responsibility =
            document
                .getElementById("responsibility")
                .checked;


        if (!responsibility) {

            message.textContent =
                "باید پذیرش مسئولیت را تأیید کنید.";

            return;
        }


        button.disabled = true;

        message.textContent =
            "در حال بررسی حساب...";


        /*
         * مرحله ۱:
         * ورود واقعی به Supabase Auth
         */

        const {
            data: loginData,
            error: loginError
        } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if (loginError) {

            console.error(
                "LOGIN ERROR:",
                loginError
            );

            message.textContent =
                "ایمیل یا رمز عبور نادرست است.";

            button.disabled = false;

            return;
        }


        if (!loginData.user) {

            message.textContent =
                "حساب وارد نشد.";

            button.disabled = false;

            return;
        }


        message.textContent =
            "حساب پیدا شد؛ در حال بررسی نقش...";


        /*
         * مرحله ۲:
         * پیدا کردن پروفایل کاربر
         */

        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, username, display_name, pen_name, role"
                )
                .eq(
                    "id",
                    loginData.user.id
                )
                .maybeSingle();


        if (profileError) {

            console.error(
                "PROFILE ERROR:",
                profileError
            );

            await supabaseClient.auth.signOut();

            message.textContent =
                "ورود انجام شد، ولی پروفایل قابل خواندن نیست.";

            button.disabled = false;

            return;
        }


        if (!profile) {

            await supabaseClient.auth.signOut();

            message.textContent =
                "برای این حساب پروفایل پیدا نشد.";

            button.disabled = false;

            return;
        }


        /*
         * مرحله ۳:
         * بررسی نقش
         */

        if (
            profile.role !== "writer" &&
            profile.role !== "owner"
        ) {

            await supabaseClient.auth.signOut();

            message.textContent =
                "این حساب نویسنده یا مالک نیست.";

            button.disabled = false;

            return;
        }


        /*
         * مرحله ۴:
         * ثبت زمان پذیرش مسئولیت
         */

        const {
            error: responsibilityError
        } =
            await supabaseClient
                .from("profiles")
                .update({
                    responsibility_accepted_at:
                        new Date().toISOString()
                })
                .eq(
                    "id",
                    loginData.user.id
                );


        if (responsibilityError) {

            console.error(
                "RESPONSIBILITY ERROR:",
                responsibilityError
            );

            await supabaseClient.auth.signOut();

            message.textContent =
                "ورود انجام شد، ولی ثبت پذیرش مسئولیت ممکن نشد.";

            button.disabled = false;

            return;
        }


        /*
         * مرحله ۵:
         * ورود کامل شد
         */

        message.textContent =
            "ورود موفق بود. در حال انتقال...";


        setTimeout(
            function() {

                window.location.href =
                    "writers.html";

            },
            500
        );

    }
);

</script>

</body>
</html>
