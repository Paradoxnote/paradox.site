<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نویسندگان | پارادوکس</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #090909;
            color: #fff;
            min-height: 100vh;
        }

        header {
            border-bottom: 1px solid #252525;
            background: #101010;
        }

        .nav {
            max-width: 1100px;
            margin: auto;
            min-height: 70px;
            padding: 15px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .nav a {
            color: #bbb;
            text-decoration: none;
            margin-right: 15px;
        }

        .container {
            width: min(850px, calc(100% - 30px));
            margin: 40px auto;
        }

        .box {
            background: #111;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 30px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .intro {
            color: #888;
            line-height: 2;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #bbb;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            background: #0b0b0b;
            color: #fff;
            border: 1px solid #333;
            border-radius: 7px;
            outline: none;
        }

        input {
            padding: 13px;
            margin-bottom: 18px;
        }

        textarea {
            min-height: 280px;
            resize: vertical;
            padding: 15px;
            line-height: 2;
            margin-bottom: 18px;
        }

        input:focus,
        textarea:focus {
            border-color: #777;
        }

        .file-box {
            border: 1px dashed #444;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .file-help {
            color: #666;
            font-size: 12px;
            margin-top: 8px;
            line-height: 1.8;
        }

        .responsibility {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 15px;
            border: 1px solid #292929;
            background: #0d0d0d;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .responsibility input {
            width: auto;
            margin: 3px 0 0;
        }

        .responsibility label {
            margin: 0;
            line-height: 1.9;
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #eee;
            color: #111;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #fff;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .message {
            min-height: 30px;
            margin-top: 18px;
            line-height: 1.9;
            color: #aaa;
        }

        .login-box {
            text-align: center;
            padding: 60px 20px;
        }

        .login-box p {
            color: #888;
            line-height: 2;
            margin: 15px 0 25px;
        }

        .login-box a {
            color: #fff;
            text-decoration: none;
            border: 1px solid #444;
            padding: 12px 25px;
            border-radius: 7px;
            display: inline-block;
        }

        @media (max-width: 600px) {
            .nav {
                flex-direction: column;
            }

            .box {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="nav">

        <div class="logo">
            پارادوکس
        </div>

        <div>
            <a href="main.html">مطالب</a>
            <a href="profile.html">پروفایل</a>
        </div>

    </div>
</header>


<main class="container">

    <section id="pageContent" class="box">

        <h1>
            بخش نویسندگان
        </h1>

        <p class="intro">
            این بخش تنها برای مالک و نویسندگان پارادوکس است.
        </p>

        <form id="postForm" onsubmit="publishPost(event); return false;">

            <label for="title">
                عنوان نوشته
            </label>

            <input
                id="title"
                type="text"
                maxlength="200"
                required
            >


            <label for="content">
                متن نوشته
            </label>

            <textarea
                id="content"
                required
            ></textarea>


            <label>
                فایل‌های همراه نوشته
            </label>

            <div class="file-box">

                <input
                    id="mediaFiles"
                    type="file"
                    multiple
                    accept="image/*,video/*,.pdf,.zip,.rar,.txt,.doc,.docx"
                >

                <div class="file-help">
                    می‌توانی یک یا چند تصویر، ویدئو یا فایل را همراه نوشته منتشر کنی.
                </div>

            </div>


            <div class="responsibility">

                <input
                    id="responsibility"
                    type="checkbox"
                    required
                >

                <label for="responsibility">
                    می‌پذیرم که تمام مسئولیت مطالب و فایل‌هایی که با حساب من منتشر
                    می‌شوند بر عهدهٔ خودم است.
                </label>

            </div>


            <button id="publishButton" type="submit">
                انتشار نوشته
            </button>

        </form>

        <div id="message" class="message"></div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://cnmkwfbgovwvyuzluera.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_gbZH8FlhWbWWKDPxCQlBFg_J1xA_PmO";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


let currentUser = null;
let currentProfile = null;


/* -----------------------------
   بررسی ورود
----------------------------- */
async function checkWriterAccess() {

    console.log("WRITERS PAGE START");

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    console.log("AUTH DATA:", data);
    console.log("AUTH ERROR:", error);

    if (error || !data.user) {

        document.getElementById("pageContent").innerHTML = `
            <div class="login-box">

                <h1>دسترسی محدود</h1>

                <p>
                    نشست ورود در این صفحه پیدا نشد.
                </p>

                <a href="writers-login.html">
                    ورود دوباره
                </a>

            </div>
        `;

        return;
    }

    currentUser = data.user;

    console.log("USER ID:", currentUser.id);


    const {
        data: profile,
        error: profileError
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();


    console.log("PROFILE:", profile);
    console.log("PROFILE ERROR:", profileError);


    if (profileError || !profile) {

        document.getElementById("pageContent").innerHTML = `
            <div class="login-box">

                <h1>خطا در پروفایل</h1>

                <p>
                    ${profileError
                        ? profileError.message
                        : "پروفایل پیدا نشد."}
                </p>

            </div>
        `;

        return;
    }


    if (
        profile.role !== "writer" &&
        profile.role !== "owner"
    ) {

        document.getElementById("pageContent").innerHTML = `
            <div class="login-box">

                <h1>دسترسی محدود</h1>

                <p>
                    این حساب نویسنده یا مالک نیست.
                </p>

            </div>
        `;

        return;
    }


    renderWriterPage(profile);
}

/* -----------------------------
   نمایش فرم نویسندگی
----------------------------- */

function renderWriterPage(profile) {

    const name =
        profile.pen_name ||
        profile.display_name ||
        "نویسنده پارادوکس";


    document.getElementById(
        "pageContent"
    ).innerHTML = `

        <h1>
            انتشار نوشته
        </h1>

        <p class="intro">
            نویسنده:
            ${escapeHtml(name)}
        </p>

        <form
            id="postForm"
            onsubmit="publishPost(event); return false;"
        >

            <label for="title">
                عنوان نوشته
            </label>

            <input
                id="title"
                type="text"
                maxlength="200"
                required
            >


            <label for="content">
                متن نوشته
            </label>

            <textarea
                id="content"
                required
            ></textarea>


            <label>
                فایل‌های همراه نوشته
            </label>

            <div class="file-box">

                <input
                    id="mediaFiles"
                    type="file"
                    multiple
                    accept="image/*,video/*,.pdf,.zip,.rar,.txt,.doc,.docx"
                >

                <div class="file-help">
                    می‌توانی تصویر، ویدئو یا فایل همراه نوشته منتشر کنی.
                </div>

            </div>


            <div class="responsibility">

                <input
                    id="responsibility"
                    type="checkbox"
                    required
                >

                <label for="responsibility">
                    می‌پذیرم که تمام مسئولیت مطالب و فایل‌هایی
                    که با این حساب منتشر می‌شوند بر عهدهٔ خودم است.
                </label>

            </div>


            <button
                id="publishButton"
                type="submit"
            >
                انتشار نوشته
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>
    `;
}


/* -----------------------------
   پیام دسترسی
----------------------------- */

function showLoginMessage(text) {

    document.getElementById(
        "pageContent"
    ).innerHTML = `

        <div class="login-box">

            <h1>
                دسترسی محدود
            </h1>

            <p>
                ${escapeHtml(text)}
            </p>

            <a href="writers-login.html">
                ورود نویسندگان
            </a>

        </div>
    `;
}


/* -----------------------------
   انتشار نوشته
----------------------------- */

async function publishPost(event) {

    event.preventDefault();
    event.stopPropagation();


    const title =
        document
            .getElementById("title")
            .value
            .trim();


    const content =
        document
            .getElementById("content")
            .value
            .trim();


    const responsibility =
        document.getElementById(
            "responsibility"
        ).checked;


    const files =
        Array.from(
            document
                .getElementById("mediaFiles")
                .files
        );


    const message =
        document.getElementById("message");


    const button =
        document.getElementById("publishButton");


    if (!title || !content) {

        message.textContent =
            "عنوان و متن نوشته را وارد کن.";

        return;
    }


    if (!responsibility) {

        message.textContent =
            "پذیرش مسئولیت را تأیید کن.";

        return;
    }


    button.disabled = true;

    message.textContent =
        "در حال انتشار...";


    /* ثبت پذیرش مسئولیت */

    const {
        error: responsibilityError
    } =
        await supabaseClient
            .from("profiles")
            .update({
                responsibility_accepted_at:
                    new Date().toISOString()
            })
            .eq(
                "id",
                currentUser.id
            );


    if (responsibilityError) {

        console.error(
            "RESPONSIBILITY ERROR:",
            responsibilityError
        );

        message.textContent =
            "خطا در ثبت مسئولیت: " +
            responsibilityError.message;

        button.disabled = false;

        return;
    }


    /* ساخت نوشته */

    const {
        data: post,
        error: postError
    } =
        await supabaseClient
            .from("posts")
            .insert({
                author_id: currentUser.id,
                title: title,
                content: content,
                responsibility_acknowledged: true,
                published: true
            })
            .select()
            .single();


    if (postError) {

        console.error(
            "POST ERROR:",
            postError
        );

        message.textContent =
            "خطای انتشار: " +
            postError.message;

        button.disabled = false;

        return;
    }


    /* بارگذاری فایل‌ها */

    for (const file of files) {

        const safeName =
            file.name.replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


        const filePath =
            currentUser.id +
            "/" +
            post.id +
            "/" +
            Date.now() +
            "_" +
            safeName;


        const {
            error: uploadError
        } =
            await supabaseClient
                .storage
                .from("post-media")
                .upload(
                    filePath,
                    file,
                    {
                        contentType: file.type,
                        upsert: false
                    }
                );


        if (uploadError) {

            console.error(
                "UPLOAD ERROR:",
                uploadError
            );

            continue;
        }


        const {
            data: publicData
        } =
            supabaseClient
                .storage
                .from("post-media")
                .getPublicUrl(
                    filePath
                );


        const {
            error: mediaError
        } =
            await supabaseClient
                .from("post_media")
                .insert({
                    post_id: post.id,
                    uploader_id: currentUser.id,
                    file_name: file.name,
                    file_path: publicData.publicUrl,
                    mime_type: file.type,
                    file_size: file.size
                });


        if (mediaError) {

            console.error(
                "MEDIA DATABASE ERROR:",
                mediaError
            );
        }
    }


    button.disabled = false;

    message.textContent =
        "نوشته با موفقیت منتشر شد.";

    document
        .getElementById("postForm")
        .reset();
}


/* -----------------------------
   جلوگیری از HTML در متن
----------------------------- */

function escapeHtml(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* شروع */

checkWriterAccess();

</script>
