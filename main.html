<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پارادوکس | مطالب</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #090909;
            color: #f2f2f2;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(10,10,10,.96);
            border-bottom: 1px solid #242424;
            backdrop-filter: blur(10px);
        }

        .nav {
            width: min(1200px, calc(100% - 30px));
            margin: auto;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .menu {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .menu a {
            color: #bbb;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 6px;
        }

        .menu a:hover {
            color: white;
            background: #1c1c1c;
        }

        .container {
            width: min(1200px, calc(100% - 30px));
            margin: auto;
            padding: 35px 0 70px;
        }

        .hero {
            padding: 40px;
            border: 1px solid #252525;
            border-radius: 15px;
            margin-bottom: 35px;

            background:
                linear-gradient(
                    to top,
                    rgba(0,0,0,.95),
                    rgba(0,0,0,.2)
                ),
                radial-gradient(
                    circle at 20% 20%,
                    #303030,
                    #101010 65%
                );
        }

        .hero small {
            color: #888;
        }

        .hero h1 {
            margin: 12px 0;
            font-size: clamp(32px, 5vw, 56px);
        }

        .hero p {
            color: #aaa;
            line-height: 2;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-title h2 {
            font-size: 25px;
        }

        .section-title span {
            color: #666;
            font-size: 13px;
        }

        .posts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            overflow: hidden;
            border: 1px solid #252525;
            border-radius: 12px;
            background: #111;
            transition: .2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #3a3a3a;
        }

        .cover {
            height: 190px;
            background: #171717;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cover img,
        .cover video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-cover {
            color: #666;
            font-size: 13px;
        }

        .content {
            padding: 20px;
        }

        .date {
            color: #666;
            font-size: 12px;
            margin-bottom: 9px;
        }

        .content h3 {
            font-size: 20px;
            line-height: 1.7;
            margin-bottom: 9px;
        }

        .excerpt {
            color: #999;
            line-height: 2;
            font-size: 14px;
            min-height: 55px;
            white-space: pre-wrap;
        }

        .author {
            margin-top: 18px;
            padding-top: 13px;
            border-top: 1px solid #252525;
            color: #777;
            font-size: 13px;
        }

        .author strong {
            color: #ccc;
        }

        .read {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 15px;
            border: 1px solid #333;
            color: #ddd;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
        }

        .read:hover {
            background: #eee;
            color: #111;
        }

        .message {
            color: #888;
            padding: 35px 10px;
            text-align: center;
        }

        footer {
            border-top: 1px solid #222;
            padding: 30px 15px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }

        @media (max-width: 900px) {
            .posts {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 620px) {
            .nav {
                padding: 13px 0;
                align-items: flex-start;
                flex-direction: column;
            }

            .posts {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="nav">

        <div class="logo">پارادوکس</div>

        <nav class="menu">
            <a href="main.html">مطالب</a>
            <a href="login.html">ورود / ثبت نام</a>
            <a href="writers.html">ورود نویسندگان</a>
            <a href="profile.html">پروفایل</a>
        </nav>

    </div>
</header>

<main class="container">

    <section class="hero">
        <small>وبگاه پارادوکس</small>
        <h1>آخرین نوشته‌ها</h1>
        <p>
            نوشته‌ها، داستان‌ها، فیلم‌ها، تصویرها و فایل‌های منتشرشده
            توسط اعضای پارادوکس.
        </p>
    </section>

    <div class="section-title">
        <h2>مطالب</h2>
        <span id="postCount">در حال بارگذاری...</span>
    </div>

    <section id="posts" class="posts">
        <div class="message">در حال دریافت نوشته‌ها...</div>
    </section>

</main>

<footer>
    © پارادوکس
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

    function escapeHtml(text) {
        return String(text ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
        return new Date(value).toLocaleDateString("fa-IR");
    }

    async function loadPosts() {

        const postsBox =
            document.getElementById("posts");

        const {
            data: posts,
            error
        } = await supabaseClient
            .from("posts")
            .select(`
                id,
                title,
                content,
                created_at,
                profiles (
                    display_name,
                    pen_name,
                    avatar_url
                ),
                post_media (
                    file_path,
                    file_name,
                    mime_type
                )
            `)
            .eq("published", true)
            .order("created_at", {
                ascending: false
            });

        if (error) {
            postsBox.innerHTML =
                `<div class="message">
                    خطا در دریافت نوشته‌ها:
                    ${escapeHtml(error.message)}
                </div>`;
            return;
        }

        document.getElementById("postCount").textContent =
            `${posts.length} نوشته`;

        if (!posts.length) {
            postsBox.innerHTML =
                `<div class="message">
                    هنوز نوشته‌ای منتشر نشده است.
                </div>`;
            return;
        }

        postsBox.innerHTML = "";

        for (const post of posts) {

            const media =
                (post.post_media || []).find(file =>
                    file.mime_type &&
                    file.mime_type.startsWith("image/")
                );

            const author =
                post.profiles?.pen_name ||
                post.profiles?.display_name ||
                "نویسنده پارادوکس";

            const excerpt =
                post.content.length > 160
                    ? post.content.slice(0, 160) + "..."
                    : post.content;

            const card =
                document.createElement("article");

            card.className = "card";

            card.innerHTML = `
                <div class="cover">
                    ${
                        media
                        ? `<img src="${escapeHtml(media.file_path)}"
                                alt="${escapeHtml(post.title)}">`
                        : `<div class="no-cover">بدون تصویر</div>`
                    }
                </div>

                <div class="content">

                    <div class="date">
                        ${formatDate(post.created_at)}
                    </div>

                    <h3>
                        ${escapeHtml(post.title)}
                    </h3>

                    <div class="excerpt">
                        ${escapeHtml(excerpt)}
                    </div>

                    <div class="author">
                        نوشته شده توسط:
                        <strong>
                            ${escapeHtml(author)}
                        </strong>
                    </div>

                    <a
                        class="read"
                        href="post.html?id=${encodeURIComponent(post.id)}"
                    >
                        خواندن نوشته
                    </a>

                </div>
            `;

            postsBox.appendChild(card);
        }
    }

    loadPosts();
</script>

</body>
</html>
