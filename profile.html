<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | پارادوکس</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #090909;
            color: white;
            min-height: 100vh;
        }

        header {
            border-bottom: 1px solid #252525;
            background: #101010;
        }

        .nav {
            max-width: 1000px;
            margin: auto;
            min-height: 70px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .nav a {
            color: #ccc;
            text-decoration: none;
            margin-right: 15px;
        }

        .container {
            width: min(700px, calc(100% - 30px));
            margin: 50px auto;
        }

        .profile-box {
            background: #111;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 35px;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #1c1c1c;
            margin: 0 auto 25px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-text {
            color: #777;
            font-size: 13px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #0b0b0b;
            border: 1px solid #333;
            border-radius: 7px;
            color: white;
            margin-bottom: 18px;
        }
#dashboardButton {
    margin-top: 12px;
    background: #181818;
    color: #ddd;
    border: 1px solid #333;
}

#dashboardButton:hover {
    background: #252525;
}
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background: #eee;
            color: #111;
            font-size: 15px;
            margin-top: 5px;
        }

        button:hover {
            background: white;
        }

        .logout {
            background: #1c1c1c;
            color: #ddd;
            margin-top: 12px;
        }

        .message {
            min-height: 28px;
            margin-top: 18px;
            color: #aaa;
            text-align: center;
            line-height: 1.8;
        }

        .role {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .nav {
                flex-direction: column;
            }

            .profile-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="nav">
        <div class="logo">پارادوکس</div>

        <div>
            <a href="main.html">مطالب</a>
            <a href="profile.html">پروفایل</a>
        </div>
    </div>
</header>

<main class="container">

    <section class="profile-box">

        <h1>پروفایل من</h1>

        <div class="avatar" id="avatarBox">
            <span class="avatar-text">بدون تصویر</span>
        </div>

        <div class="role" id="roleText">
            در حال بارگذاری...
        </div>

        <label for="displayName">
            نام نمایشی
       <label for="penName">
    لقب نویسندگی
</label>

<input
    type="text"
    id="penName"
    maxlength="50"
    placeholder="مثلاً سایه، نگهبان، نویسنده خاموش..."
>
        </label>

        <input
            type="text"
            id="displayName"
            maxlength="50"
            placeholder="نامی که در سایت نمایش داده می‌شود"
        >

        <label for="avatarFile">
            عکس پروفایل
        </label>

        <input
            type="file"
            id="avatarFile"
            accept="image/*"
        >

        <button id="saveButton">
            ذخیره تغییرات
        </button>
<button id="dashboardButton" style="display:none;">
    ورود به بخش نویسندگان
</button>
        <button id="logoutButton" class="logout">
            خروج از حساب
        </button>

        <div id="message" class="message"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://cnmkwfbgovwvyuzluera.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gbZH8FlhWbWWKDPxCQlBFg_J1xA_PmO";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    let currentUser = null;
    let currentProfile = null;


    async function loadProfile() {

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        if (!user) {
            window.location.href = "login.html";
            return;
        }

        currentUser = user;

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();

        if (error) {
            document.getElementById("message").textContent =
                "خطا در دریافت پروفایل: " + error.message;
            return;
        }

        currentProfile = data;

        document.getElementById("displayName").value =
            data.display_name || "";
document.getElementById("penName").value =
    data.pen_name || "";
        
        const roleNames = {
            owner: "مالک",
            writer: "نویسنده",
            user: "کاربر"
        };

        document.getElementById("roleText").textContent =
            "نقش: " + (roleNames[data.role] || "کاربر");
const dashboardButton =
    document.getElementById("dashboardButton");


if (
    data.role === "writer" ||
    data.role === "owner"
) {

    dashboardButton.style.display =
        "block";

    dashboardButton.textContent =
        data.role === "owner"
            ? "ورود به داشبورد مالک"
            : "ورود به داشبورد نویسنده";

}
        if (data.avatar_url) {
            document.getElementById("avatarBox").innerHTML =
                `<img src="${data.avatar_url}" alt="تصویر پروفایل">`;
        }
    }


    async function saveProfile() {

        if (!currentUser) return;

        const message =
            document.getElementById("message");

       const displayName =
    document.getElementById("displayName")
        .value
        .trim();

const penName =
    document.getElementById("penName")
        .value
        .trim();

        const avatarFile =
            document.getElementById("avatarFile").files[0];

        message.textContent =
            "در حال ذخیره...";


        let avatarUrl = currentProfile.avatar_url;


        if (avatarFile) {

            const extension =
                avatarFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            const filePath =
                currentUser.id +
                "/avatar." +
                extension;


            const {
                error: uploadError
            } = await supabaseClient
                .storage
                .from("avatars")
                .upload(
                    filePath,
                    avatarFile,
                    {
                        upsert: true,
                        contentType: avatarFile.type
                    }
                );


            if (uploadError) {

                message.textContent =
                    "خطا در بارگذاری تصویر: " +
                    uploadError.message;

                return;
            }


            const {
                data
            } = supabaseClient
                .storage
                .from("avatars")
                .getPublicUrl(filePath);

            avatarUrl =
                data.publicUrl;


            document.getElementById("avatarBox").innerHTML =
                `<img src="${avatarUrl}" alt="تصویر پروفایل">`;
        }


        const {
            error
        } = await supabaseClient
            .from("profiles")
           .update({
    display_name: displayName,
    pen_name: penName,
    avatar_url: avatarUrl
})
            .eq("id", currentUser.id);


        if (error) {

            message.textContent =
                "خطا در ذخیره پروفایل: " +
                error.message;

            return;
        }


        currentProfile.display_name =
            displayName;

        currentProfile.avatar_url =
            avatarUrl;
currentProfile.pen_name =
    penName;
        message.textContent =
            "پروفایل با موفقیت ذخیره شد.";
    }


    document
        .getElementById("saveButton")
        .addEventListener(
            "click",
            saveProfile
        );


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            async function() {

                await supabaseClient.auth.signOut();

                window.location.href =
                    "login.html";
            }
        );
document
    .getElementById("dashboardButton")
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "writer-dashboard.html";

        }
    );

    loadProfile();
    
</script>

</body>
</html>
